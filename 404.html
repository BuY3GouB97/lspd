<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#01040b">
  <title>404 | LSPD Command</title>
  <script>
    (function () {
      var clean = location.pathname.replace(/\/+$/, "").toLowerCase();
      if (clean.endsWith("/login")) location.replace(location.pathname.replace(/\/?$/, "/index.html"));
      if (clean.endsWith("/register")) location.replace(location.pathname.replace(/\/?$/, "/index.html"));
    })();
  </script>
  <link rel="icon" type="image/png" href="header.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #edf7ff;
      background:
        radial-gradient(circle at 50% 35%, rgba(231, 81, 90, .2), transparent 22rem),
        linear-gradient(115deg, rgba(0, 62, 125, .18), transparent 30%),
        linear-gradient(180deg, rgba(1, 4, 11, .82), rgba(1, 4, 11, .98)),
        url("image4.png") center / cover fixed,
        #01040b;
      font-family: Inter, Arial, sans-serif;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .25;
      background:
        linear-gradient(rgba(58, 167, 255, .07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(231, 81, 90, .08) 1px, transparent 1px);
      background-size: 54px 54px;
    }
    .lost-panel {
      position: relative;
      width: min(780px, 100%);
      padding: clamp(28px, 6vw, 56px);
      border: 1px solid rgba(231, 81, 90, .34);
      border-radius: 8px;
      background: rgba(3, 9, 19, .86);
      box-shadow: 0 32px 120px rgba(0, 0, 0, .7), 0 0 50px rgba(231, 81, 90, .16);
      backdrop-filter: blur(18px) saturate(1.18);
      text-align: center;
      overflow: hidden;
    }
    .lost-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 0%, rgba(231, 81, 90, .16), transparent 42%);
    }
    .code {
      margin: 0;
      color: #ff727b;
      font-family: Orbitron, Inter, sans-serif;
      font-size: clamp(72px, 18vw, 170px);
      line-height: .82;
      text-shadow: 0 0 35px rgba(231, 81, 90, .4);
    }
    .kicker {
      margin: 0 0 12px;
      color: #9ccfff;
      font-family: "Share Tech Mono", monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 12px 0 10px;
      font-family: Orbitron, Inter, sans-serif;
      font-size: clamp(24px, 5vw, 42px);
      text-transform: uppercase;
    }
    p {
      max-width: 560px;
      margin: 0 auto 24px;
      color: #9fb4c9;
      line-height: 1.7;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    a {
      min-height: 44px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #fff8f9;
      border: 1px solid rgba(231, 81, 90, .76);
      clip-path: polygon(0 0, calc(100% - 9px) 0, 100% 9px, 100% 100%, 9px 100%, 0 calc(100% - 9px));
      background: linear-gradient(135deg, rgba(231, 81, 90, .92), rgba(93, 12, 24, .94));
      font-family: "Share Tech Mono", monospace;
      font-weight: 900;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
    }
    a.secondary {
      color: #dceeff;
      border-color: rgba(58, 167, 255, .32);
      background: rgba(5, 22, 46, .7);
    }
  </style>
</head>
<body>
  <main class="lost-panel">
    <p class="kicker">LSPD Command Routing Failure</p>
    <p class="code">404</p>
    <h1>Page Not Found</h1>
    <p>The requested command route does not exist or has been moved out of the active LSPD system registry.</p>
    <div class="actions">
      <a href="index.html"><i class="fa-solid fa-house"></i> Return Hub</a>
      <a class="secondary" href="javascript:history.back()"><i class="fa-solid fa-arrow-left"></i> Go Back</a>
    </div>
  </main>
</body>
</html>
